dist: trusty
language: java
install: true
before_install:
  - curl -fsSL -o /tmp/temurin8.tar.gz "https://api.adoptium.net/v3/binary/latest/8/ga/linux/x64/jdk/hotspot/normal/eclipse"
  - mkdir -p $HOME/temurin8 && tar -xzf /tmp/temurin8.tar.gz -C $HOME/temurin8 --strip-components=1
  - export JAVA_HOME=$HOME/temurin8
  - export PATH=$JAVA_HOME/bin:$PATH
  - java -version
before_cache:
  - rm -f $HOME/.gradle/caches/modules-2/modules-2.lock
cache:
  directories:
    - $HOME/.gradle/caches/
    - $HOME/.gradle/wrapper/
env:
    - GRADLE_ENTERPRISE_URL=https://ge.spring.io/
script:
  - ./gradlew check --no-daemon --console=plain -I gradle/seal-test-summary.gradle
after_script:
  - echo "Skipped tests (upstream @Disabled annotations with reasons):"
  - grep -rn -A1 "@Disabled" spring-kafka/src/test spring-kafka-test/src/test
